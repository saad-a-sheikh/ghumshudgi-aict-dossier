      const CIPHER_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&/[]*=-_';

      const DecodeText = ({ text, trigger = false, className = '', speed = 22 }) => {
        const [displayText, setDisplayText] = useState(text);

        const runDecode = useCallback(() => {
          let iteration = 0;
          const interval = window.setInterval(() => {
            setDisplayText(
              text
                .split('')
                .map((char, index) => {
                  if (char === ' ') return ' ';
                  if (index < iteration) return text[index];
                  return CIPHER_CHARS[Math.floor(Math.random() * CIPHER_CHARS.length)];
                })
                .join('')
            );
            if (iteration >= text.length) window.clearInterval(interval);
            iteration += 0.5;
          }, speed);
          return () => window.clearInterval(interval);
        }, [text, speed]);

        useEffect(() => {
          if (trigger) return runDecode();
          setDisplayText(text);
        }, [trigger, text, runDecode]);

        return (
          <span onMouseEnter={runDecode} className={className}>
            {displayText}
          </span>
        );
      };

                  <h2 className="font-display text-3xl sm:text-5xl font-bold text-[#E3E1D9]">
                    THE ANATOMY OF A FRAME-UP
                  </h2>

                <div className="mt-12 grid grid-cols-1 lg:grid-cols-12 gap-10">
                  <div className="lg:col-span-6 rounded-lg bg-[#121316] border border-[#2A2B30] hover:border-red-600/60 p-6 sm:p-8 space-y-5">
                    <div className="font-mono text-xs text-[#C2272D] border-b border-[#2A2B30] pb-3 font-bold">
                      INVESTIGATIVE NARRATIVE // NAWABSHAH TO KARACHI
                    </div>
                    <p className="text-sm sm:text-base text-[#E3E1D9]/90 leading-relaxed">
                      <strong>Saman</strong>, an innocent village girl from <strong>Nawabshah</strong>, travels to <strong>Karachi</strong> to work as a live-in caretaker for a wealthy woman named <strong>Farah Begum</strong> to pay for her sick father <strong>Baba’s</strong> life-saving medication.
                    </p>
                    <p className="text-sm sm:text-base text-[#9CA3AF] leading-relaxed">
                      Farah confiscates Saman’s <strong>CNIC</strong> under the guise of employment verification, secretly registering the house lease in Saman’s name. Saman bonds deeply with Farah’s toddler, <strong>Yusuf</strong>, but gradually uncovers double biometric deadbolts and locked nursery doors.
                    </p>
                    <p className="text-sm sm:text-base text-[#9CA3AF] leading-relaxed">
                      While treating a minor fall, Saman discovers old newspaper clippings showing Yusuf is actually <strong>Ali Khan</strong>, a kidnapped child. Though she reaches the front door with a chance to flee, Saman turns back to save the toddler.
                    </p>
                    <p className="text-sm sm:text-base text-[#E3E1D9] leading-relaxed border-l-2 border-[#C2272D] pl-4 bg-[#0A0A0C] p-3 rounded-r">
                      Farah corners her and triggers a corrupt police trap; officers accept a cash payoff, confiscate the evidence, and frame Saman alongside an alleged accomplice named <strong>Tariq</strong>. The story ends with a televised police press conference praising the arrest, Farah driving away completely free, and Saman sobbing in a cold Karachi lockup worrying about her father’s medication.
                    </p>
                  </div>

                            {member.name}
                          </h3>
                          {member.isLead && (
                            <span className="px-2 py-0.5 rounded bg-[#C2272D] text-white font-mono text-[10px] font-bold shrink-0">
                              TEAM LEAD
                            </span>
                          )}
                        </div>
                        <p className="font-mono text-xs text-[#C2272D] font-semibold mb-3">
                          {member.role}
                        </p>
                        <p className="text-xs text-[#9CA3AF] mb-4 leading-relaxed">
                          {member.specialization}
                        </p>

                        <div className="space-y-1.5 bg-[#0A0A0C]/80 p-3 rounded border border-[#2A2B30] group-hover:border-[#C2272D]/40 transition-colors">
                          <div className="font-mono text-[10px] text-[#9CA3AF] flex items-center justify-between">
                            <span>KEY ROLES ({member.contributions.length} LOGGED)</span>
                            <span className="text-[#C2272D]">CLICK TO EXPAND</span>
                          </div>
                          {member.contributions.slice(0, 2).map((item, i) => (
                            <div
                              key={i}
                              className="flex items-center gap-1.5 font-mono text-[11px] text-[#E3E1D9]/90 truncate"
                            >
                              <span className="w-1.5 h-1.5 rounded-full bg-[#C2272D] shrink-0" />
                              <span className="truncate">{item}</span>
                            </div>
                          ))}
                          {member.contributions.length > 2 && (
                            <div className="font-mono text-[10px] text-[#9CA3AF] pl-3">
                              + {member.contributions.length - 2} more operational roles...
                            </div>
                          )}
                        </div>
                      </div>

                      <div className="mt-5 pt-3 border-t border-[#2A2B30] flex items-center justify-between font-mono text-[11px]">
                        <span className="text-[#9CA3AF]">ID: {member.rollNo}</span>
                        <span className="text-[#C2272D] font-bold group-hover:translate-x-0.5 transition-transform">
                          [ OPEN PROFILE → ]
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* MEMBER PROFILE POPUP MODAL */}
            {selectedMember && (
              <div
                onClick={() => setSelectedMember(null)}
                className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 overflow-y-auto"
              >
                <div
                  onClick={(e) => e.stopPropagation()}
                  className="w-full max-w-2xl rounded-lg bg-[#121316] border border-[#C2272D] shadow-dossier overflow-hidden my-auto"
                >
                  <div className="flex items-center justify-between gap-3 px-6 py-4 bg-[#0A0A0C] border-b border-[#2A2B30]">
                    <div>
                      <div className="font-mono text-xs font-bold text-[#E3E1D9] tracking-wider">
                        PERSONNEL DOSSIER // {selectedMember.badgeNumber}
                      </div>
                      <div className="font-mono text-[10px] text-[#9CA3AF]">
                        {selectedMember.clearance} • DUET BSCS SECTION A3
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => {
                          const i = TEAM_ROSTER.findIndex((m) => m.id === selectedMember.id);
                          setSelectedMember(
                            TEAM_ROSTER[(i - 1 + TEAM_ROSTER.length) % TEAM_ROSTER.length]
                          );
                        }}
                        className="px-2.5 py-1 rounded bg-[#121316] border border-[#2A2B30] hover:border-red-600/60 font-mono text-xs text-[#E3E1D9]"
                      >
                        ←
                      </button>
                      <button
                        onClick={() => {
                          const i = TEAM_ROSTER.findIndex((m) => m.id === selectedMember.id);
                          setSelectedMember(TEAM_ROSTER[(i + 1) % TEAM_ROSTER.length]);
                        }}
                        className="px-2.5 py-1 rounded bg-[#121316] border border-[#2A2B30] hover:border-red-600/60 font-mono text-xs text-[#E3E1D9]"
                      >
                        →
                      </button>
                      <button
                        onClick={() => setSelectedMember(null)}
                        className="px-3 py-1 rounded bg-[#C2272D] text-white font-mono text-xs font-bold"
                      >
                        [ESC / CLOSE]
                      </button>
                    </div>
                  </div>

                  <div className="p-6 sm:p-8 space-y-6">
                    <div className="flex flex-wrap items-start justify-between gap-4 pb-5 border-b border-[#2A2B30]">
                      <div className="space-y-1.5">
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="font-mono text-[11px] px-2.5 py-0.5 rounded bg-[#0A0A0C] border border-[#2A2B30] text-[#E3E1D9] font-bold">
                            ROLL NO: {selectedMember.rollNo}
                          </span>
                          {selectedMember.isLead && (
                            <span className="px-2.5 py-0.5 rounded bg-[#C2272D] text-white font-mono text-[10px] font-bold tracking-wider">
                              TEAM LEAD &amp; PRODUCTION SUPERVISOR
                            </span>
                          )}
                        </div>
                        <h3 className="font-display text-3xl sm:text-4xl font-bold text-[#E3E1D9] pt-1">
                          {selectedMember.name}
                        </h3>
                        <p className="font-mono text-sm text-[#C2272D] font-bold">
                          {selectedMember.role}
                        </p>
                      </div>
                      <span className="forensic-stamp px-3 py-1 font-mono text-xs font-bold -rotate-2">
                        VERIFIED CREDIT
                      </span>
                    </div>

                    <div className="p-4 rounded bg-[#0A0A0C] border border-[#2A2B30] space-y-1">
                      <div className="font-mono text-[10px] text-[#9CA3AF] uppercase tracking-widest">
                        ASSIGNED UNIT // {selectedMember.departmentUnit}
                      </div>
                      <p className="text-xs sm:text-sm text-[#E3E1D9]/90">
                        {selectedMember.specialization}
                      </p>
                    </div>

                    <div className="space-y-3">
                      <div className="flex items-center justify-between font-mono text-xs text-[#E3E1D9]">
                        <span className="font-bold tracking-wider">
                          OPERATIONAL CONTRIBUTIONS &amp; PRODUCTION CREDITS
                        </span>
                        <span className="text-[#9CA3AF] text-[11px]">
                          {selectedMember.contributions.length} VERIFIED TASKS
                        </span>
                      </div>
                      <div className="grid grid-cols-1 gap-2.5">
                        {selectedMember.contributions.map((contribution, idx) => (
                          <div
                            key={contribution}
                            className="flex items-center justify-between gap-3 p-3.5 rounded bg-[#0A0A0C] border border-[#2A2B30] hover:border-[#C2272D]/60 transition-colors"
                          >
                            <div className="flex items-center gap-3">
                              <span className="px-2 py-0.5 rounded bg-[#C2272D]/15 border border-[#C2272D]/40 font-mono text-[11px] font-bold text-[#C2272D]">
                                0{idx + 1}
                              </span>
                              <span className="text-sm sm:text-base text-[#E3E1D9] font-medium">
                                {contribution}
                              </span>
                            </div>
                            <span className="text-[#C2272D] font-mono text-xs font-bold">✓</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="pt-4 border-t border-[#2A2B30] space-y-2">
                      <div className="font-mono text-[10px] text-[#9CA3AF] uppercase">
                        QUICK SWITCH INVESTIGATOR PROFILE:
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {TEAM_ROSTER.map((m) => (
                          <button
                            key={m.id}
                            onClick={() => setSelectedMember(m)}
                            className={`px-2.5 py-1 rounded font-mono text-[11px] border transition-all ${
                              m.id === selectedMember.id
                                ? 'bg-[#C2272D] text-white border-[#C2272D] font-bold'
                                : 'bg-[#0A0A0C] text-[#9CA3AF] border-[#2A2B30] hover:text-[#E3E1D9] hover:border-red-600/60'
                            }`}
                          >
                            {m.name.split(' ')[0]}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* VIDEO MODAL */}
            {isFilmModalOpen && (
              <div
                onClick={() => setIsFilmModalOpen(false)}
                className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4"
              >
                <div
                  onClick={(e) => e.stopPropagation()}
                  className="w-full max-w-4xl rounded-lg bg-[#121316] border border-[#2A2B30] overflow-hidden shadow-dossier"
                >
                  <div className="flex items-center justify-between px-5 py-3 bg-[#0A0A0C] border-b border-[#2A2B30] font-mono text-xs">
                    <span>GHUMSHUDGI (گمشدگی) // 16:9 SCREENING ROOM</span>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => fileInputRef.current?.click()}
                        className="px-2.5 py-1 rounded bg-[#121316] border border-[#2A2B30] hover:border-red-600/60"
                      >
                        LOAD .MP4 FILE
                      </button>
                      <input
                        ref={fileInputRef}
                        type="file"
                        accept="video/*"
                        onChange={handleFileSelect}
                        className="hidden"
                      />
                      <button
                        onClick={() => setIsFilmModalOpen(false)}
                        className="px-2.5 py-1 rounded bg-[#C2272D] text-white font-bold"
                      >
                        [ESC / CLOSE]
                      </button>
                    </div>
                  </div>
                  <div className="aspect-video bg-[#0A0A0C] flex flex-col justify-between">
                    {modalMode === 'video' && videoSrc ? (
                      <video key={videoSrc} controls autoPlay playsInline className="w-full h-full object-contain bg-black">
                        {videoSrc && videoSrc !== './public/DRAMA_TEASER1.mp4' ? <source src={videoSrc} type="video/mp4" /> : null}
                        <source src="./public/DRAMA_TEASER1.mp4" type="video/mp4" />
                        <source src="./DRAMA_TEASER1.mp4" type="video/mp4" />
                        <source src="/DRAMA_TEASER1.mp4" type="video/mp4" />
                        <source src="https://raw.githubusercontent.com/saad-a-sheikh/ghumshudgi-aict-dossier/main/public/DRAMA_TEASER1.mp4" type="video/mp4" />
                      </video>
                    ) : (
                      <>
                        <div className="flex justify-between font-mono text-xs text-[#9CA3AF]">
                          <span className="text-[#C2272D] font-bold">
                            {STORYBOARD_SCENES[reelSlide].sceneNumber} // {STORYBOARD_SCENES[reelSlide].act}
                          </span>
                          <span>TC: {STORYBOARD_SCENES[reelSlide].timecode}</span>
                        </div>
                        <div className="my-auto text-center max-w-2xl mx-auto space-y-3">
                          <h4 className="font-display text-3xl font-bold text-[#E3E1D9]">
                            {STORYBOARD_SCENES[reelSlide].title}
                          </h4>
                          <p className="text-sm sm:text-base text-[#E3E1D9]/90">
                            &ldquo;{STORYBOARD_SCENES[reelSlide].logline}&rdquo;
                          </p>
                          <p className="font-mono text-xs text-[#C2272D]">
                            {STORYBOARD_SCENES[reelSlide].forensicFlag}
                          </p>
                        </div>
                        <div className="flex justify-between items-center font-mono text-xs border-t border-[#2A2B30] pt-3">
                          <button
                            onClick={() =>
                              setReelSlide(
                                (reelSlide - 1 + STORYBOARD_SCENES.length) % STORYBOARD_SCENES.length
                              )
                            }
                            className="px-3 py-1 rounded bg-[#121316] border border-[#2A2B30]"
                          >
                            ← PREV SCENE
                          </button>
                          <button
                            onClick={() => fileInputRef.current?.click()}
                            className="px-3 py-1 rounded bg-[#C2272D] text-white font-bold"
                          >
                            SELECT LOCAL .MP4 VIDEO
                          </button>
                          <button
                            onClick={() => setReelSlide((reelSlide + 1) % STORYBOARD_SCENES.length)}
                            className="px-3 py-1 rounded bg-[#121316] border border-[#2A2B30]"
                          >
                            NEXT SCENE →
                          </button>
                        </div>
                      </>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
