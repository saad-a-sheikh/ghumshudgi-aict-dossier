      const CIPHER_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&/[]*=-_';

      const DecodeText = ({ text, trigger = false, className = '', speed = 22 }) => {
        const [displayText, setDisplayText] = useState(text);

        const runDecode = useCallback(() => {
          let iteration = 0;
          const interval = window.setInterval(() => {
            setDisplayText(
              text
                .split('')
                .map((char, index) => {
                  if (char === ' ') return ' ';
                  if (index < iteration) return text[index];
                  return CIPHER_CHARS[Math.floor(Math.random() * CIPHER_CHARS.length)];
                })
                .join('')
            );
            if (iteration >= text.length) window.clearInterval(interval);
            iteration += 0.5;
          }, speed);
          return () => window.clearInterval(interval);
        }, [text, speed]);

        useEffect(() => {
          if (trigger) return runDecode();
          setDisplayText(text);
        }, [trigger, text, runDecode]);

        return (
          <span onMouseEnter={runDecode} className={className}>
            {displayText}
          </span>
        );
      };

                          <button
                            onClick={() =>
                              setReelSlide(
                                (reelSlide - 1 + STORYBOARD_SCENES.length) % STORYBOARD_SCENES.length
                              )
                            }
                            className="px-3 py-1 rounded bg-[#121316] border border-[#2A2B30]"
                          >
                            ← PREV SCENE
                          </button>
                          <button
                            onClick={() => fileInputRef.current?.click()}
                            className="px-3 py-1 rounded bg-[#C2272D] text-white font-bold"
                          >
                            SELECT LOCAL .MP4 VIDEO
                          </button>
                          <button
                            onClick={() => setReelSlide((reelSlide + 1) % STORYBOARD_SCENES.length)}
                            className="px-3 py-1 rounded bg-[#121316] border border-[#2A2B30]"
                          >
                            NEXT SCENE →
                          </button>
                        </div>
                      </>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
